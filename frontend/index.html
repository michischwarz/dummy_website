<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Meine erste Website</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Überschrift und Absatz -->
    <h1>Hallo Welt!</h1>
    <p>Das ist meine erste eigene Website.</p>
    <p id="dynText">Das ist der ursprüngliche Text.</p>
    <p id="secretText">Ich bin ein geheimer Text!</p>

    <!-- Neuer Button zum Klicken -->
    <button id="button001">Klick mich</button>
    <button id="button002">Klick mich</button>
    <button id="button003_dyn_text">Change Text</button>
    <button id="button004_toggle_secret">Toggle Secret</button>
    
    <!-- Zähleranzeige und Buttons -->
    <p>Aktueller Wert: <span id="counter">0</span></p>
    <button id="plusButton">+1</button>
    <button id="minusButton">-1</button>

    <!-- Show randon number -->
    <p>Eine Zufallszahl: <span id="rand_num">---</span></p>
    <button id="fetch_rand">Show random Number</button>

    <!-- Einbinden der JavaScript-Datei -->
    <script src="script.js"></script>
</body>
</html>
